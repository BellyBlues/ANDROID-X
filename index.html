
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#101526">
  <title>ANDROID X</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="status">
    <span>ANDROID X</span>
    <span id="clock">11:00</span>
  </div>

  <header>
    <h1>ANDROID X</h1>
    <p>Cloud Android Gaming</p>
  </header>

  <main>
    <section class="device">
      <div class="android-icon">🤖</div>
      <h2>Android System</h2>
      <p id="connection">Cloud engine not connected</p>
      <button id="connect">CONNECT TO ANDROID</button>
    </section>

    <h2 class="section-title">My Apps</h2>

    <div class="apps">
      <button class="app" data-app="games">
        <span>🎮</span>Games
      </button>
      <button class="app" data-app="browser">
        <span>🌐</span>Browser
      </button>
      <button class="app" data-app="settings">
        <span>⚙️</span>Settings
      </button>
      <button class="app" data-app="fighterz">
        <span>🐉</span>DBZ Gaming
      </button>
    </div>

    <section class="panel" id="panel">
      <h2>Welcome to ANDROID X</h2>
      <p>Your Android gaming dashboard is ready.</p>
      <p>The cloud Android engine still needs to be configured.</p>
    </section>
  </main>

  <footer>
    ANDROID X · CLOUD GAMING
  </footer>

  <script src="emulator.js"></script>
</body>
</html>
